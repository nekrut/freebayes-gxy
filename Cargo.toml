[workspace]
resolver = "2"
members = [
    "crates/fb-core",
    "crates/fb-genotype",
    "crates/fb-vcf",
    "crates/fb-scheduler",
    "crates/fb-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/nekrut/freebayes-gxy"
authors = ["freebayes-gxy contributors"]

[workspace.dependencies]
rust-htslib = "0.47"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"

# Keep compile output reasonable for a dev-heavy workspace.
[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
